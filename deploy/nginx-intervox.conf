# nginx site for the API on the devbox (/etc/nginx/sites-available/intervox).
# certbot --nginx -d intervox.duckdns.org adds the 443 block and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name intervox.duckdns.org;

    # Answer clips are capped at 10 MB by Flask; leave a little headroom.
    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Matches gunicorn's 120 s timeout (plan + transcribe can be slow).
        proxy_read_timeout 125s;
    }

    location / {
        return 404;
    }
}
