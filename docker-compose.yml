# Backend stack for the Oracle Always Free VM: MySQL + Flask API + Caddy (HTTPS).
# The frontend is on Vercel. Settings come from ./.env (copy deploy/env.example).
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mock_interviewer
      MYSQL_USER: mock
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u mock -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./backend
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment: &api-env
      APP_ENV: production
      TRUST_PROXY: "1"
      DATABASE_URL: mysql+pymysql://mock:${MYSQL_PASSWORD}@db:3306/mock_interviewer?charset=utf8mb4
    depends_on:
      db:
        condition: service_healthy
    # Healthy once migrations ran and gunicorn answers.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Deletes résumés and job descriptions past their 30 days, once a day.
  purge:
    build: ./backend
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "0"
    command: ["sh", "-c", "while true; do flask purge-expired; sleep 86400; done"]
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  caddy-data:
  caddy-config:
